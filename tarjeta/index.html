*{box-sizing:border-box}

.band{height:96px;background:var(--accent)}
.who{display:grid;justify-items:center;text-align:center;gap:6px;padding:0 24px 20px;margin-top:-62px}
.who img{width:124px;height:124px;border-radius:50%;object-fit:cover;border:5px solid var(--card)}

.role{font:600 .95rem 'Schibsted Grotesk',system-ui,sans-serif;color:var(--accent)}
.place{color:var(--muted);font-size:.9rem}
.claim{margin:10px 0 0;color:var(--muted);font-size:.95rem}
.acts{display:grid;gap:10px;padding:4px 20px 20px}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;text-decoration:none;border-radius:14px;padding:14px 16px;font:600 1rem 'Schibsted Grotesk',system-ui,sans-serif;border:1px solid var(--line);color:var(--ink);background:transparent;cursor:pointer}
.btn svg{width:20px;height:20px;flex:0 0 auto}
.btn.main{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.wa{background:var(--wa);color:#fff;border-color:var(--wa)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.foot{border-top:1px solid var(--line);padding:14px 20px;display:flex;justify-content:space-between;align-items:center;gap:12px;color:var(--muted);font-size:.82rem}
.foot button{background:none;border:0;color:var(--accent);font:600 .85rem 'Public Sans',sans-serif;cursor:pointer}
